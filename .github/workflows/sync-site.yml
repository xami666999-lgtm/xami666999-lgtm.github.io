name: Sync Mxsify site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xami666999-lgtm/musify
          ref: site
          path: site
      - uses: actions/checkout@v4
        with:
          path: pages
      - name: Copy site build
        run: |
          cp -a site/. pages/
          rm -rf pages/.git
          cd pages
          git config user.name xami666999-lgtm
          git config user.email 308808809+xami666999-lgtm@users.noreply.github.com
          git add -A
          git commit -m "Publish Mxsify 1.6.0 site" || echo "no changes"
          git push
