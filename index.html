<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mxsify</title>
  <style>
    body { margin: 0; background: #121212; color: #fff; font-family: Inter, system-ui, sans-serif; }
  </style>
</head>
<body>
  <script src="./gate.js"></script>
  <script>
    (function () {
      function saved() {
        try { return JSON.parse(localStorage.getItem("mxsify-login") || "null"); } catch (e) { return null; }
      }
      function enter() {
        if (saved() && saved().email) location.replace("./.html");
      }
      enter();
      document.addEventListener("submit", function () { setTimeout(enter, 30); });
    })();
  </script>
</body>
</html>
