<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PartyUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --side: #c2185b;
  --side-dark: #9d1450;
  --side-deep: #7a1040;
  --ink: #1b1b1f;
  --muted: #6b7280;
  --line: #ece7ea;
  --card: #fff;
  --bg: #f6f4f5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: Outfit, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
.side { background: var(--side); color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px; font-weight: 700; letter-spacing: -.02em; }
.brand svg { width: 26px; height: 26px; }
.nav { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: #fff; height: 38px; border-radius: 8px; padding: 0 12px; text-align: left; cursor: pointer; font: inherit; font-weight: 550; }
.nav button.on, .nav button:hover { background: var(--side-dark); }
.plats { flex: 1; overflow: auto; padding: 6px 10px 12px; }
.plats button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: #fff; height: 34px; border-radius: 8px; padding: 0 12px; text-align: left; cursor: pointer; font: inherit; }
.plats button.on, .plats button:hover { background: var(--side-dark); }
.main { min-width: 0; background: #fff; }
.home { padding: 22px 28px 70px; }
.kicker { display: flex; align-items: center; gap: 8px; color: var(--side); font-weight: 700; font-size: 22px; margin: 0 0 16px; }
.hero { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: center; }
.box { width: 180px; height: 250px; border-radius: 6px; background: #111; box-shadow: 0 10px 24px rgba(0,0,0,.18); object-fit: cover; }
.box.ph { display: grid; place-items: center; color: #fff; font-weight: 800; text-align: center; padding: 12px; }
.hero h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: -.03em; }
.plat { color: var(--muted); margin: 0 0 16px; }
.actions { display: flex; gap: 12px; }
.btn { height: 46px; padding: 0 22px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
.btn.go { background: var(--side); color: #fff; border: 0; }
.btn.ghost { background: #fff; color: var(--side); border: 2px solid var(--side); }
.recent { margin-top: 28px; background: #fde8ef; border-radius: 10px; padding: 12px 14px 16px; }
.recent h2 { margin: 0 0 12px; color: var(--side); font-size: 18px; }
.row { display: flex; gap: 16px; overflow: auto; }
.card { width: 140px; flex: none; text-align: center; cursor: pointer; background: none; border: 0; font: inherit; }
.card img, .card .ph { width: 140px; height: 190px; object-fit: cover; border-radius: 6px; background: #222; }
.card b { display: block; margin-top: 8px; font-size: 14px; }
.card small { color: var(--muted); }
.page { background: #1c1c1e; color: #fff; min-height: 100vh; padding: 22px 28px 80px; }
.page h1 { margin: 0 0 8px; font-size: 34px; }
.hint { color: #aaa; margin: 0 0 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
.empty { text-align: center; padding: 80px 20px; color: #bbb; }
.add { background: var(--side); color: #fff; border: 0; height: 36px; padding: 0 14px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
.detail { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 22px 28px 80px; background: #fff; }
.meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f4f4f5; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
.meta div { font-size: 13px; color: #444; }
.party { background: #fff; padding: 22px 28px 80px; }
.room { display: flex; gap: 10px; align-items: center; margin: 12px 0 20px; }
.room input, .chat input { height: 42px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font: inherit; }
.code { font-size: 28px; letter-spacing: .2em; font-weight: 800; color: var(--side); }
.members { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { background: #fde8ef; color: var(--side); border-radius: 999px; padding: 6px 12px; font-weight: 700; }
.chat { border: 1px solid #eee; border-radius: 12px; padding: 12px; max-width: 560px; }
.chat .log { min-height: 120px; max-height: 220px; overflow: auto; margin-bottom: 8px; }
.chat .log p { margin: 4px 0; }
.play-stage { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; }
.play-bar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: #fff; background: #111; }
#game { flex: 1; }
.keys { position: fixed; right: 16px; bottom: 12px; display: flex; gap: 8px; font-size: 12px; color: #666; }
.keys span { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 4px 8px; }
.hidden { display: none !important; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { min-height: auto; }
  .hero, .detail { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="#fff" stroke-width="2"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M7.5 24.5l2.8-2.8M21.7 10.3l2.8-2.8" stroke="#fff" stroke-width="2"/></svg>
      PartyUp
    </div>
    <nav class="nav">
      <button data-view="home" class="on">Home</button>
      <button data-view="games">Games</button>
      <button data-view="history">History</button>
      <button data-view="party">Party Up</button>
    </nav>
    <div class="plats" id="plats"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="keys"><span>↑ ↓ ← → Move</span><span>Enter Confirm</span><span>Z Back</span></div>
<input id="file" type="file" accept=".nes,.sfc,.smc,.gba,.gbc,.gb,.md,.gen,.bin,.zip,.n64,.z64" multiple class="hidden" />
<script>
const PLATS = [
  ['nes', 'NES'], ['snes', 'Super NES'], ['gb', 'Game Boy'], ['gbc', 'Game Boy Color'],
  ['gba', 'Game Boy Advance'], ['genesis', 'Genesis'], ['arcade', 'Arcade'], ['a2600', 'Atari 2600']
]
const CORE = { nes: 'nes', snes: 'snes', gb: 'gb', gbc: 'gb', gba: 'gba', genesis: 'segaMD', arcade: 'arcade', a2600: 'a2600' }
const store = JSON.parse(localStorage.getItem('ra-lib') || '{"games":[],"history":[],"party":null,"me":""}')
if (!store.me) store.me = 'Player' + Math.floor(Math.random() * 90 + 10)
function save() {
  localStorage.setItem('ra-lib', JSON.stringify(store))
  try { bc.postMessage({ type: 'party', party: store.party, me: store.me }) } catch {}
}
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('ra-party') : { postMessage() {}, onmessage: null }
bc.onmessage = (ev) => {
  if (!ev.data || ev.data.type !== 'party' || !store.party) return
  if (ev.data.party && ev.data.party.code === store.party.code) {
    store.party = ev.data.party
    if (!store.party.members.includes(store.me)) store.party.members.push(store.me)
    localStorage.setItem('ra-lib', JSON.stringify(store))
    if (view === 'party') render()
  }
}
function platName(id) { return (PLATS.find(p => p[0] === id) || ['', id])[1] }
function guessPlat(name) {
  const n = name.toLowerCase()
  if (n.endsWith('.gba')) return 'gba'
  if (n.endsWith('.gbc')) return 'gbc'
  if (n.endsWith('.gb')) return 'gb'
  if (n.endsWith('.sfc') || n.endsWith('.smc')) return 'snes'
  if (n.endsWith('.md') || n.endsWith('.gen')) return 'genesis'
  return 'nes'
}
function titleOf(name) { return name.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ') }

let view = 'home'
let filter = ''
let focus = 0

function renderPlats() {
  document.getElementById('plats').innerHTML = PLATS.map(([id, name]) =>
    `<button data-plat="${id}" class="${filter === id ? 'on' : ''}">${name}</button>`).join('')
}
function games() { return filter ? store.games.filter(g => g.plat === filter) : store.games }

function card(g) {
  const art = g.art ? `<img src="${g.art}" alt="" />` : `<div class="ph" style="background:${g.color}">${g.title}</div>`
  return `<button class="card" data-id="${g.id}">${art}<small>${platName(g.plat)}</small><b>${g.title}</b></button>`
}

function render() {
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view && !filter))
  renderPlats()
  const main = document.getElementById('main')
  const list = games()
  const last = store.history[0] && store.games.find(g => g.id === store.history[0])
  if (view === 'home') {
    main.innerHTML = `<div class="home">
      <p class="kicker">▶ Continue</p>
      <div class="hero">
        ${last ? (last.art ? `<img class="box" src="${last.art}" />` : `<div class="box ph" style="background:${last.color}">${last.title}</div>`) : `<div class="box ph">Add a ROM</div>`}
        <div>
          <h1>${last ? last.title : 'Your cabinet'}</h1>
          <p class="plat">${last ? platName(last.plat) : 'Upload your own ROMs. Nothing is bundled.'}</p>
          <div class="actions">
            ${last ? `<button class="btn go" data-play="${last.id}">Continue</button><button class="btn ghost" data-play="${last.id}">Start</button>` : `<button class="btn go" id="add">Add ROMs</button>`}
          </div>
        </div>
      </div>
      <section class="recent"><h2>Recent ›</h2><div class="row">${store.history.map(id => store.games.find(g => g.id === id)).filter(Boolean).map(card).join('') || '<p>Play a game and it shows up here.</p>'}</div></section>
    </div>`
  } else if (view === 'games' || filter) {
    main.innerHTML = `<div class="page">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h1>${filter ? platName(filter) : 'Library'}</h1>
        <button class="add" id="add">Add</button>
      </div>
      <p class="hint">${list.length} games. These are ROMs you added.</p>
      ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty"><p>Welcome to PartyUp. This is where all ROMs uploaded by you will appear.</p><button class="add" id="add2">Add some ROMs</button></div>`}
    </div>`
  } else if (view === 'history') {
    const rows = store.history.map(id => store.games.find(g => g.id === id)).filter(Boolean)
    main.innerHTML = `<div class="page"><h1>History</h1><div class="grid">${rows.map(card).join('') || '<p class="hint">Nothing played yet.</p>'}</div></div>`
  } else if (view === 'party') {
    const p = store.party
    main.innerHTML = `<div class="party">
      <p class="kicker">Party Up</p>
      <h1>Play together</h1>
      <p class="hint">Make a room, share the code, and start the same game.</p>
      ${p ? `<div class="code">${p.code}</div>
        <p>You are ${store.me}. Share this code.</p>
        <div class="members">${p.members.map(m => `<span class="chip">${m}</span>`).join('')}</div>
        <div class="actions">
          <button class="btn go" id="pick">Pick a game</button>
          <button class="btn ghost" id="leave">Leave party</button>
        </div>
        ${p.game ? `<p>Now playing: <b>${p.game.title}</b></p><button class="btn go" data-play="${p.game.id}">Play with party</button>` : ''}
        <div class="chat"><div class="log" id="log">${(p.chat || []).map(c => `<p><b>${c.who}</b> ${c.text}</p>`).join('')}</div>
          <div class="room"><input id="msg" placeholder="Say something" /><button class="btn go" id="send">Send</button></div>
        </div>` : `<div class="room"><input id="name" value="${store.me}" placeholder="Your name" /><button class="btn go" id="host">Create party</button></div>
        <div class="room"><input id="code" placeholder="Room code" maxlength="6" /><button class="btn ghost" id="join">Join</button></div>`}
    </div>`
  } else if (view === 'detail') {
    const g = store.games.find(x => x.id === focus)
    if (!g) { view = 'games'; render(); return }
    main.innerHTML = `<div class="detail">
      ${g.art ? `<img class="box" src="${g.art}" />` : `<div class="box ph" style="background:${g.color}">${g.title}</div>`}
      <div>
        <p class="plat">Games › ${platName(g.plat)} › ${g.title}</p>
        <h1>${g.title}</h1>
        <div class="meta">
          <div>Platform<br><b>${platName(g.plat)}</b></div>
          <div>Players<br><b>1–2</b></div>
          <div>Added<br><b>by you</b></div>
        </div>
        <div class="actions">
          <button class="btn go" data-play="${g.id}">Start</button>
          <button class="btn ghost" data-party="${g.id}">Party Up</button>
        </div>
      </div>
    </div>`
  }
}

function openGame(id) {
  const g = store.games.find(x => x.id === id)
  if (!g) return
  store.history = [id, ...store.history.filter(x => x !== id)].slice(0, 12)
  save()
  const stage = document.createElement('div')
  stage.className = 'play-stage'
  stage.innerHTML = `<div class="play-bar"><b>${g.title}</b><div><button class="btn ghost" id="saveState">Save</button> <button class="btn go" id="closePlay">Close</button></div></div><div id="game"></div>`
  document.body.appendChild(stage)
  window.EJS_player = '#game'
  window.EJS_core = CORE[g.plat] || 'nes'
  window.EJS_gameUrl = g.url
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'
  window.EJS_startOnLoaded = true
  const s = document.createElement('script')
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js'
  document.body.appendChild(s)
  stage.querySelector('#closePlay').onclick = () => { stage.remove(); s.remove() }
  stage.querySelector('#saveState').onclick = () => { try { window.EJS_emulator?.gameManager?.saveState?.() } catch {} }
}

function makeCode() { return Math.random().toString(36).slice(2, 8).toUpperCase() }

document.body.addEventListener('click', (e) => {
  const t = e.target.closest('button')
  if (!t) return
  if (t.dataset.view) { view = t.dataset.view; filter = ''; render() }
  if (t.dataset.plat) { filter = t.dataset.plat; view = 'games'; render() }
  if (t.dataset.id) { focus = t.dataset.id; view = 'detail'; render() }
  if (t.dataset.play) openGame(t.dataset.play)
  if (t.id === 'add' || t.id === 'add2') document.getElementById('file').click()
  if (t.id === 'host') {
    store.me = document.getElementById('name').value || store.me
    store.party = { code: makeCode(), members: [store.me], chat: [], game: null }
    save(); render()
  }
  if (t.id === 'join') {
    const code = (document.getElementById('code').value || '').toUpperCase()
    if (code.length < 4) return
    store.party = { code, members: [store.me], chat: [{ who: 'Room', text: 'Joined ' + code }], game: null }
    save(); render()
  }
  if (t.id === 'leave') { store.party = null; save(); render() }
  if (t.id === 'send') {
    const input = document.getElementById('msg')
    if (!input.value.trim() || !store.party) return
    store.party.chat.push({ who: store.me, text: input.value.trim() })
    save(); render()
  }
  if (t.id === 'pick') { view = 'games'; render() }
  if (t.dataset.party) {
    const g = store.games.find(x => x.id === t.dataset.party)
    store.party = store.party || { code: makeCode(), members: [store.me], chat: [], game: null }
    store.party.game = { id: g.id, title: g.title }
    store.party.chat.push({ who: 'Room', text: 'Party game: ' + g.title })
    save(); view = 'party'; render()
  }
})

document.getElementById('file').onchange = async (e) => {
  for (const file of e.target.files) {
    const buf = await file.arrayBuffer()
    const blob = new Blob([buf])
    const url = URL.createObjectURL(blob)
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6)
    store.games.unshift({ id, title: titleOf(file.name), plat: guessPlat(file.name), url, color: '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0') })
  }
  save()
  view = 'games'
  render()
}

document.addEventListener('keydown', (e) => {
  const cards = [...document.querySelectorAll('.card')]
  if (e.key === 'ArrowRight') focus = Math.min(cards.length - 1, (cards.findIndex(c => c.dataset.id === focus) + 1))
  if (e.key === 'ArrowLeft') focus = Math.max(0, (cards.findIndex(c => c.dataset.id === focus) - 1))
  if (e.key === 'Enter' && cards[focus]) cards[focus].click()
  if (e.key.toLowerCase() === 'z' && view === 'detail') { view = 'games'; render() }
})

render()
</script>
</body>
</html>
